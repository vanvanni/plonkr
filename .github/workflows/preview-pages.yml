name: Prerelease website
on:
  push:
    branches: [prerelease]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prerelease-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/prerelease' && vars.PREVIEW_PAGES_REPOSITORY != ''
    runs-on: ubuntu-24.04
    environment: prerelease-pages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run build
      - run: node scripts/preview-site.mjs
      - name: Checkout dedicated Pages repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PREVIEW_PAGES_REPOSITORY }}
          ref: main
          token: ${{ secrets.PREVIEW_PAGES_TOKEN }}
          path: preview-site
      - name: Commit generated preview
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git -C preview-site rm -r --ignore-unmatch .
          cp -a dist/. preview-site/
          git -C preview-site config user.name 'github-actions[bot]'
          git -C preview-site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C preview-site add --all
          if ! git -C preview-site diff --cached --quiet; then
            git -C preview-site commit -m "Preview from plonkr $SOURCE_SHA"
            git -C preview-site push origin HEAD:main
          fi
